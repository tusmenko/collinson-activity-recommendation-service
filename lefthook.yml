pre-commit:
  jobs:
    - name: lint-staged
      run: pnpm exec lint-staged
    - name: typecheck
      run: pnpm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: unit and integration
      run: pnpm run test:unit && pnpm run test:integration
