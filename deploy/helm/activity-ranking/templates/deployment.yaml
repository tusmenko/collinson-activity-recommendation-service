apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "activity-ranking.fullname" . }}
  labels:
    {{- include "activity-ranking.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "activity-ranking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "activity-ranking.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # A configuration change rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's node user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "activity-ranking.fullname" . }}
          {{- if .Values.worker.enabled }}
          # The worker Deployment runs the queue processors; these pods only serve GraphQL.
          env:
            - name: QUEUE_PROCESSORS_ENABLED
              value: 'false'
          {{- end }}
          ports:
            - name: http
              containerPort: 4510
          # Readiness checks Redis and takes the pod out of the Service while it is down; liveness only asks whether
          # the process answers, so a Redis outage never restarts it.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
