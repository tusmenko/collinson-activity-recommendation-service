{{- /* Every key of .env.example with its default (design D-2); REDIS_URL from values; values.env overrides any key.
UPSTREAM_BASE_URL has no default (unset means Open-Meteo's real hosts); set it in values.env to point at a stub. */ -}}
{{- $defaults := dict
  "NODE_ENV" "production"
  "PORT" "4510"
  "WINDOW_DAYS" "7"
  "FETCH_DAYS" "8"
  "FRESHNESS_TTL" "6h"
  "RETENTION_TTL" "24h"
  "UPSTREAM_TIMEOUT_MS" "2000"
  "UPSTREAM_RETRIES" "1"
  "COLD_READ_BOUND_MS" "4500"
  "OUTBOUND_PER_MINUTE" "500"
  "OUTBOUND_LIMIT_WINDOW_MS" "60000"
  "OUTBOUND_PER_DAY" "9000"
  "INBOUND_PER_MINUTE" "60"
  "QUERY_MAX_LOCATIONS" "5"
  "GEOCODE_TTL" "30d"
  "QUEUE_PROCESSORS_ENABLED" "true"
  "LOG_LEVEL" "info"
  "OTEL_EXPORTER" "console"
-}}
{{- $config := mergeOverwrite $defaults (dict "REDIS_URL" .Values.redisUrl) .Values.env -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "activity-ranking.fullname" . }}
  labels:
    {{- include "activity-ranking.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
