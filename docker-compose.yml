# docker compose up --build                 api against Open-Meteo, on localhost:4510
# docker compose --profile demo up --build  adds api-demo against the stub upstream, on localhost:4511
x-api: &api
  build: .
  environment: &api-env
    PORT: '4510'
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4510/health >/dev/null || exit 1']
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 3

services:
  api:
    <<: *api
    ports:
      - '${API_PORT:-4510}:4510'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  stub-upstream:
    profiles: [demo]
    build:
      context: .
      dockerfile: test/stub-upstream/Dockerfile
    environment:
      STUB_SHIFT_DATES: '1'

  api-demo:
    <<: *api
    profiles: [demo]
    environment:
      <<: *api-env
      UPSTREAM_BASE_URL: http://stub-upstream:8080
      # The load job (scripts/load.mjs) sends thousands of requests a minute from one client; the default 60 would
      # turn most of them into RATE_LIMITED. Only the demo service is raised; api keeps the default.
      INBOUND_PER_MINUTE: '100000'
    depends_on:
      redis:
        condition: service_healthy
      stub-upstream:
        condition: service_healthy
    ports:
      - '${API_DEMO_PORT:-4511}:4510'

volumes:
  redis-data:
